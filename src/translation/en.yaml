  paragraphs:
    me_description: >
      I'm a software engineer at [Strawberry](/blog/strawberry-launch/), where we build AI companions for people who aren't developers. I work on how they behave: the memory that lets them remember what matters to you, and the evaluations that show whether a change makes them better.


      I have a master's in Computer Science from KTH, where I focused on software engineering, formal languages and machine learning. My thesis grew out of [Rost](/blog/rost/), the programming language I've been building in Rust. I've been programming for more than a decade, from C++ games to an optical race-timing system and [hackathon projects](/blog/).


      Want to talk about agents, programming languages or something you're building? [Get in touch](/contact).
    contact: >
      Feel free to contact me by phone or by email. You can also use the contact form below.