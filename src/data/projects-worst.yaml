  - title: 'Research notes'
    id: 'longtext'
    year: '2022'
    tech: 'LaTeX'
    img: './static/valladack.webp'
    url: 'https://example.com/'
    linkDescription: 'A link description long enough to run past the short note it was designed for, the way a caption does once someone explains the caveat properly.'
    text:
      - >
        A pasted abstract, the length people actually paste. Compiler construction for a statically typed language targeting
        several backends, with a type checker that recovers from errors so the editor keeps working on a broken file. The
        parser is recursive descent, the intermediate representation is a flat instruction list, and the WebAssembly backend
        emits a module per compilation unit. The evaluation compares compile times against reference implementations across a
        corpus of two hundred programs, measures the size of the emitted modules, and reports where the recovering type checker
        produces worse diagnostics than a failing one. The conclusion is that error recovery is worth the complexity for editor
        integration and not worth it for batch compilation, which is roughly what everyone expected before the measurements,
        but the numbers now exist and the thresholds are specific rather than folkloric.
      - A second paragraph, because one was never going to be enough.

