# Worst-case fixture for the projects timeline. Dev-only: scripts/break-ui.sh
# renders the page against this instead of projects.yaml. Every value here is
# something a real project entry could plausibly contain — a German compound
# name, a repo URL inside a sentence, a title with an ampersand, a project
# whose screenshot was never taken — not random noise.
projects:
  - title: 'Benachrichtigungseinstellungen-Konfigurator'
    id: 'german'
    year: '2026'
    tech: 'TypeScript · React · Redux Toolkit · Tailwind · Playwright · Vitest · Storybook'
    img: './static/rustlang.webp'
    url: 'https://github.com/didrikmunther'
    target: '_blank'
    text:
      - A notification settings configurator for a German client. The longest word here is a single unbreakable token, which is what a compound noun looks like to a browser.
      - 'Repository: https://github.com/didrikmunther/benachrichtigungseinstellungen-konfigurator-frontend'

